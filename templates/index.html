<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Scrapper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --blue: #1a5ae0;
            --blue-dark: #0f45b8;
            --line: #e1e4ea;
            --text: #222;
            --sub: #767b85;
            --bg: #f4f6f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        /* 상단 헤더 */
        .gnb { background: #fff; border-bottom: 1px solid var(--line); }
        .gnb-inner {
            max-width: 1100px; margin: 0 auto; padding: 0 20px;
            height: 60px; display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 22px; font-weight: 900; color: var(--blue); letter-spacing: -0.5px; }
        .logo span { color: var(--text); }
        .gnb-menu { display: flex; gap: 24px; font-size: 15px; font-weight: 500; }
        .gnb-menu a:hover { color: var(--blue); }

        /* 메인 검색 영역 */
        .hero {
            flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
        }
        .hero h1 { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        .hero h1 em { font-style: normal; color: var(--blue); }
        .hero p { color: var(--sub); font-size: 16px; margin-bottom: 36px; }

        .search-box {
            width: 100%; max-width: 680px;
            display: flex;
            border: 3px solid var(--blue);
            border-radius: 40px;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(26, 90, 224, 0.15);
        }
        .search-box input {
            flex: 1; border: 0; outline: 0;
            padding: 0 28px; height: 60px;
            font-size: 18px; font-family: inherit;
        }
        .search-box button {
            border: 0; background: var(--blue); color: #fff;
            font-size: 17px; font-weight: 700; font-family: inherit;
            padding: 0 36px; cursor: pointer;
        }
        .search-box button:hover { background: var(--blue-dark); }

        .keywords { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .keywords span { color: var(--sub); font-size: 14px; margin-right: 4px; line-height: 32px; }
        .keywords a {
            border: 1px solid var(--line); background: #fff;
            border-radius: 16px; padding: 0 14px; line-height: 30px;
            font-size: 14px;
        }
        .keywords a:hover { border-color: var(--blue); color: var(--blue); }

        footer {
            text-align: center; color: var(--sub); font-size: 13px;
            padding: 24px 20px; border-top: 1px solid var(--line); background: #fff;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 28px; }
            .search-box input { height: 52px; font-size: 16px; padding: 0 18px; }
            .search-box button { padding: 0 20px; }
            .gnb-menu { display: none; }
        }
    </style>
</head>
<body>
    <header class="gnb">
        <div class="gnb-inner">
            <a href="/" class="logo">Job<span>Scrapper</span></a>
            <nav class="gnb-menu">
                <a href="/">채용정보</a>
                <a href="/search?keyword=신입">신입</a>
                <a href="/search?keyword=경력">경력</a>
            </nav>
        </div>
    </header>

    <main class="hero">
        <h1>내게 꼭 맞는 <em>채용공고</em>를 찾아보세요</h1>
        <p>인크루트의 최신 채용정보를 한 번에 모아 보여드립니다.</p>

        <form action="/search" class="search-box">
            <input type="text" name="keyword" placeholder="직무, 회사, 키워드를 입력하세요" required autofocus />
            <button>검색</button>
        </form>

        <div class="keywords">
            <span>인기 검색어</span>
            <a href="/search?keyword=인사총무">인사총무</a>
            <a href="/search?keyword=마케팅">마케팅</a>
            <a href="/search?keyword=개발자">개발자</a>
            <a href="/search?keyword=회계">회계</a>
            <a href="/search?keyword=디자이너">디자이너</a>
            <a href="/search?keyword=영업">영업</a>
        </div>
    </main>

    <footer>© Job Scrapper · 채용정보 출처: 인크루트</footer>
</body>
</html>
